name: Build and Release ABL Payroll

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release OTA Update
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout Code ──
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Set up JDK 21 ──
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── 3. Install Android SDK 36 & Build Tools ──
      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      # ── 4. Set up Node.js 22 ──
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # ── 5. Install JS Dependencies ──
      - name: Install npm dependencies
        run: npm ci

      # ── 6. Build Web Assets ──
      - name: Build web assets
        run: npm run build

      # ── 7. Capacitor Sync Android ──
      - name: Capacitor sync android
        run: npx cap sync android

      # ── 8. Cache Gradle ──
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: gradle-

      # ── 9. Make gradlew executable ──
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 10. Compile Release APK & AAB ──
      - name: Gradle clean, assembleRelease and bundleRelease
        working-directory: android
        run: |
          ./gradlew clean --no-daemon
          ./gradlew assembleRelease --no-daemon
          ./gradlew bundleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ── 11. Generate version.json & release-notes.json ──
      - name: Generate Update Configs
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.0.${{ github.run_number }}"
          
          # Write version.json
          cat <<EOF > version.json
          {
              "versionCode": ${VERSION_CODE},
              "versionName": "${VERSION_NAME}",
              "minimumVersion": 1,
              "mandatory": false,
              "releaseDate": "$(date +'%Y-%m-%d')",
              "apkUrl": "https://github.com/adreman651-dot/ablpayrollsolutions/releases/latest/download/app-release.apk",
              "releaseNotesUrl": "https://github.com/adreman651-dot/ablpayrollsolutions/releases/latest/download/release-notes.json"
          }
          EOF
          
          # Write release-notes.json
          cat <<EOF > release-notes.json
          {
           "version": "${VERSION_NAME}",
           "changes": [
             "Attendance improvements",
             "Payroll improvements",
             "Dashboard improvements",
             "Performance optimization",
             "Bug fixes"
           ]
          }
          EOF

      # ── 12. Commit version.json to main (powers raw.githubusercontent.com URL) ──
      - name: Commit version.json to main branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json release-notes.json
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore(ota): update version.json to v1.0.${{ github.run_number }} [skip ci]"
          git push origin main

      # ── 13. Package Output Files ──
      - name: Package Output Artifacts
        run: |
          # Find compiled APK and bundle AAB files
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" app-release.apk
            echo "Found APK at $APK_PATH"
          else
            echo "Error: Release APK not found!"
            exit 1
          fi
          
          if [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" app-release.aab
            echo "Found AAB at $AAB_PATH"
          else
            echo "Error: Release AAB not found!"
            exit 1
          fi

      # ── 14. Create GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            app-release.apk
            app-release.aab
            version.json
            release-notes.json
          token: ${{ secrets.GITHUB_TOKEN }}
